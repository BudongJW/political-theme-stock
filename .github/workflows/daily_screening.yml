name: PollStock 테마주 스크리닝

on:
  schedule:
    # 2시간 간격 스크리닝 (KST → UTC, KST=UTC+9 고정, DST 없음)
    - cron: '0 1 * * 1-5'   # KST 10:00 - 장 시작 후
    - cron: '0 3 * * 1-5'   # KST 12:00 - 오전 마감
    - cron: '0 5 * * 1-5'   # KST 14:00 - 오후 장중
    - cron: '40 6 * * 1-5'  # KST 15:40 - 장 마감 후 (메인)
  push:
    # 코드·설정 변경이 main에 머지되면 즉시 재스크리닝 (봇의 데이터 커밋은 경로가 달라 재트리거되지 않음)
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/daily_screening.yml'
  workflow_dispatch:  # 수동 실행 가능 (휴장일에도 강제 실행)

# 예약 실행과 머지 트리거 실행이 겹치면 순서대로 실행 (동시 커밋 충돌 방지)
concurrency:
  group: pollstock-screening
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install pykrx pandas numpy pyyaml requests beautifulsoup4 lxml setuptools google-genai feedparser python-dotenv holidays

      - name: 휴장일 확인 (공휴일·대체공휴일·선거일·연말 휴장 스킵)
        id: holiday-check
        # holidays 패키지가 음력 명절·대체공휴일·선거일을 자동 계산 → 매년 수동 갱신 불필요
        run: |
          python - <<'PY'
          import datetime, os, zoneinfo
          import holidays

          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Seoul")).date()
          name = holidays.KR(years=today.year).get(today)
          if (today.month, today.day) == (12, 31):
              name = "KRX 연말 휴장일"
          if not name and today.weekday() >= 5:
              name = "주말"
          if name and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              print(f"📅 {today} {name} — 수동 실행이므로 강제 진행")
              name = None
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_holiday={'true' if name else 'false'}\n")
              f.write(f"today={today.isoformat()}\n")
          print(f"📅 {today} {name} — 스크리닝 스킵" if name else f"📅 {today} 거래일 — 스크리닝 진행")
          PY

      - name: 스크리닝 실행
        if: steps.holiday-check.outputs.is_holiday != 'true'
        id: screening
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python scripts/run_screening.py

      - name: 결과 커밋 (GitHub Pages 갱신)
        if: steps.holiday-check.outputs.is_holiday != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data/gemini_cache/ data/suggestions/ data/assets/ data/polls/
          git diff --staged --quiet || git commit -m "chore: PollStock 스크리닝 $(date -u +'%Y-%m-%d %H:%M')"
          # 실행 중 main에 다른 커밋(코드 머지 등)이 들어온 경우 대비
          git pull --rebase origin main
          git push

      - name: 실패 시 GitHub Issue 생성
        if: failure() && steps.holiday-check.outputs.is_holiday != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = '${{ steps.holiday-check.outputs.today }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[자동] 스크리닝 실패 — ${today}`,
              body: `## 스크리닝 워크플로우 실패\n\n- **날짜:** ${today}\n- **실행 로그:** ${runUrl}\n- **트리거:** ${context.eventName}\n\n자동 생성된 이슈입니다. 로그를 확인해주세요.`,
              labels: ['bug', 'automated']
            });
